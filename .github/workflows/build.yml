name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U pyside6 faster-whisper huggingface_hub pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --windowed --name WhisperGUI
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all av
          --collect-all huggingface_hub --collect-all tokenizers whisper_gui.py
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperGUI-Setup
          path: installer/WhisperGUI-Setup.exe
